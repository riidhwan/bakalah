name: Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: ${{ startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository && 'release-publication' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: >
      github.repository == 'riidhwan/bakalah' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    name: Validate release intent
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release intent
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: .github/scripts/validate-release-intent.sh "${{ github.event.pull_request.head.ref }}"

  gate:
    name: Release gate
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

  build:
    name: Build
    needs: [validate, gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APKs
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Prepare APKs
        run: |
          .github/scripts/rename-release-apks.sh "${{ needs.validate.outputs.tag }}"
          .github/scripts/verify-release-artifacts.sh "${{ needs.validate.outputs.tag }}"

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bakalah
          path: |
            bakalah-${{ needs.validate.outputs.tag }}.apk
            bakalah-arm64-v8a-${{ needs.validate.outputs.tag }}.apk
            bakalah-armeabi-v7a-${{ needs.validate.outputs.tag }}.apk
            bakalah-x86-${{ needs.validate.outputs.tag }}.apk
            bakalah-x86_64-${{ needs.validate.outputs.tag }}.apk

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release notes
        run: .github/scripts/prepare-release-notes.sh "${{ needs.validate.outputs.tag }}"

      - name: Download APKs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true

      - name: Prepare complete artifact set
        run: |
          .github/scripts/verify-release-artifacts.sh "${{ needs.validate.outputs.tag }}"
          .github/scripts/create-release-checksums.sh "${{ needs.validate.outputs.tag }}"

      - name: Stage, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: .github/scripts/publish-release.sh

      - name: Delete transient workflow artifacts
        if: ${{ success() }}
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: bakalah
