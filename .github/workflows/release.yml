name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  get_tag:
    if: github.repository == 'riidhwan/bakalah'
    name: Validate release version
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get tag name
        id: extract
        run: .github/scripts/validate-release-inputs.sh

  gate:
    if: github.repository == 'riidhwan/bakalah'
    name: Release gate
    runs-on: 'ubuntu-24.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

  build:
    if: github.repository == 'riidhwan/bakalah'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: [get_tag, gate]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APK
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: .github/scripts/rename-release-apks.sh release ${{ needs.get_tag.outputs.tag }}

      - name: Verify APKs
        run: .github/scripts/verify-release-artifacts.sh release ${{ needs.get_tag.outputs.tag }}

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bakalah
          path: |
            bakalah-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-x86-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'riidhwan/bakalah'
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: [get_tag, gate]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew assembleFoss -Penable-updater

      - name: Sign APK
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/foss
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: .github/scripts/rename-release-apks.sh foss ${{ needs.get_tag.outputs.tag }}

      - name: Verify APK
        run: .github/scripts/verify-release-artifacts.sh foss ${{ needs.get_tag.outputs.tag }}

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bakalah-foss
          path: bakalah-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'riidhwan/bakalah'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare release notes
        id: changelog
        run: .github/scripts/prepare-release-notes.sh ${{ needs.get_tag.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true

      - name: Verify release artifact set
        run: .github/scripts/verify-release-artifacts.sh all ${{ needs.get_tag.outputs.tag }}

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: |
            bakalah
            bakalah-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Bakalah ${{ needs.get_tag.outputs.tag }}
          body_path: release_body.md
          files: |
            bakalah-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-${{ needs.get_tag.outputs.tag }}-foss.apk
            bakalah-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-x86-${{ needs.get_tag.outputs.tag }}.apk
            bakalah-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
