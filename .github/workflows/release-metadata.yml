name: Release Metadata
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'riidhwan/bakalah' && startsWith(github.head_ref, 'release/')
    name: Validate release metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/validate-release-branch.sh "${{ github.head_ref }}" --check-remote
