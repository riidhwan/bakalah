name: Tag Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  tag:
    if: >
      github.repository == 'riidhwan/bakalah' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    name: Create release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Validate release branch
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/validate-release-branch.sh "${{ github.event.pull_request.head.ref }}" --check-remote

      - name: Create release tag
        env:
          RELEASE_TAG_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: .github/scripts/create-release-tag.sh
